name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: node -e 'const fs=require("node:fs"); JSON.parse(fs.readFileSync("dist/cards.json","utf8")); JSON.parse(fs.readFileSync("dist/build-info.json","utf8"));'
